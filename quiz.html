<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Begineer Lvl1</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff00ff;
            --secondary: #00ffff;
            --accent: #ffff00;
            --bg: #000000;
            --screen: #1a1a2e;
            --pixel: 2px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Press Start 2P', cursive;
            image-rendering: pixelated;
        }

        body {
            background: var(--bg);
            color: var(--primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
            overflow: hidden;
            background: 
                radial-gradient(circle at center, #1a1a2e 0%, #000 100%),
                repeating-linear-gradient(
                    0deg,
                    rgba(255, 0, 255, 0.1) 0px,
                    rgba(255, 0, 255, 0.1) 1px,
                    transparent 1px,
                    transparent 2px
                );
        }

        .screen {
            position: relative;
            width: 95%;
            max-width: 1000px;
            min-height: 80vh;
            background: var(--screen);
            border: 4px solid var(--primary);
            padding: 3rem;
            transform-style: preserve-3d;
            transform: rotateX(5deg) rotateY(-5deg);
            box-shadow: 
                20px 20px 0 rgba(255, 0, 255, 0.2),
                40px 40px 0 rgba(0, 255, 255, 0.1);
            margin: 2rem auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .screen::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                linear-gradient(
                    to bottom,
                    rgba(255, 0, 255, 0.1) 0%,
                    transparent 50%,
                    rgba(0, 255, 255, 0.1) 100%
                );
            pointer-events: none;
        }

        h1 {
            text-align: center;
            margin: 2rem 0 3rem;
            color: var(--accent);
            text-shadow: 
                4px 4px 0 var(--primary),
                8px 8px 0 var(--secondary);
            font-size: 3.5rem;
            letter-spacing: 3px;
            transform: rotate(-1deg);
            animation: glitch 5s infinite;
            line-height: 1.3;
        }

        .btn {
            background: var(--primary);
            color: #000;
            border: none;
            padding: 1.5rem 3rem;
            font-family: 'Press Start 2P', cursive;
            font-size: 1.5rem;
            cursor: pointer;
            position: relative;
            margin: 1.5rem 0;
            text-transform: uppercase;
            min-width: 300px;
            letter-spacing: 2px;
            transition: all 0.3s;
            border: 4px solid var(--primary);
            box-shadow: 
                4px 4px 0 var(--secondary),
                8px 8px 0 var(--accent);
            z-index: 10; /* Ensure button is above other elements */
            pointer-events: auto !important; /* Force clickable */
        }
        
        /* Make sure the button container is properly positioned */
        .container {
            position: relative;
            z-index: 5;
        }

        .btn:hover {
            transform: translate(2px, 2px);
            box-shadow: 
                2px 2px 0 var(--secondary),
                4px 4px 0 var(--accent);
        }

        .btn:active {
            transform: translate(4px, 4px);
            box-shadow: none;
        }

        .primary-btn {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }

        .secondary-btn {
            background: transparent;
            color: var(--secondary);
            border-color: var(--secondary);
            position: relative;
            z-index: 10;
            pointer-events: auto !important;
        }
        
        /* Ensure the skip button container has proper stacking context */
        .game-container > div[style*="text-align: center"] {
            position: relative;
            z-index: 5;
            pointer-events: auto;
        }

        .timer-section {
            position: fixed;
            top: 2rem;
            right: 2rem;
            background: rgba(0, 0, 0, 0.8);
            padding: 1.2rem 2rem;
            border: 4px solid var(--accent);
            border-radius: 8px;
            transform: rotate(-1deg);
            z-index: 1000;
            box-shadow: 0 0 20px rgba(255, 255, 0, 0.7);
        }
        
        .timer-section:hover {
            transform: rotate(0deg) scale(1.05);
            transition: all 0.3s ease;
        }

        .timer {
            color: var(--accent);
            font-size: 1.8rem;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(255, 255, 0, 0.7);
            letter-spacing: 1px;
        }
        
        /* Add some animation for the timer when it's running low */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        .timer.low-time {
            animation: pulse 1s infinite;
            color: #ff4444;
        }

        .question-container {
            margin: 2rem 0;
            padding: 1.5rem;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid var(--secondary);
            position: relative;
        }

        .question-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
        }

        .question-text {
            margin-bottom: 1.5rem;
            line-height: 1.6;
            color: #fff;

    100% { transform: scale(1); }

    animation: pulse 1s infinite;

            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .option-btn {
            background: rgba(0, 0, 0, 0.7);
            border: 3px solid var(--primary);
            color: white;
            padding: 1.5rem;
            font-family: 'Press Start 2P', cursive;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
            position: relative;
            overflow: hidden;
            z-index: 100;
            pointer-events: auto !important;
        }

        .option-btn:hover {
            background: rgba(255, 0, 255, 0.3);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(255, 0, 255, 0.4);
        }
        
        .option-btn:active {
            transform: translateY(1px);
        }

        .option-btn.correct {
            background: rgba(0, 255, 0, 0.2);
            border-color: #0f0;
            color: #0f0;
        }

        .option-btn.incorrect {
            background: rgba(255, 0, 0, 0.2);
            border-color: #f00;
            color: #f00;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
            margin: 3rem 0;
            position: relative;
            z-index: 100;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--screen);
            padding: 2rem;
            border: 4px solid var(--accent);
            max-width: 80%;
            text-align: center;
            position: relative;
            transform-style: preserve-3d;
            animation: modalAppear 0.5s ease-out;
        }

        @keyframes modalAppear {
            from {
                opacity: 0;
                transform: translateY(-50px) rotateX(30deg);
            }
            to {
                opacity: 1;
                transform: translateY(0) rotateX(0);
            }
        }

        @keyframes glitch {
            0%, 100% {
                text-shadow: 
                    3px 3px 0 var(--primary),
                    6px 6px 0 var(--secondary);
            }
            25% {
                text-shadow: 
                    -3px 3px 0 var(--secondary),
                    -6px 6px 0 var(--accent);
            }
            50% {
                text-shadow: 
                    3px -3px 0 var(--accent),
                    6px -6px 0 var(--primary);
            }
            75% {
                text-shadow: 
                    -3px -3px 0 var(--primary),
                    -6px -6px 0 var(--secondary);
            }
        }

        .pixel-corner {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 4px solid var(--accent);
            z-index: 1;
        }

        .pixel-corner.tl {
            top: -10px;
            left: -10px;
            border-right: none;
            border-bottom: none;
        }

        .pixel-corner.tr {
            top: -10px;
            right: -10px;
            border-left: none;
            border-bottom: none;
        }

        .pixel-corner.bl {
            bottom: -10px;
            left: -10px;
            border-right: none;
            border-top: none;
        }

        .pixel-corner.br {
            bottom: -10px;
            right: -10px;
            border-left: none;
            border-top: none;
        }

        /* Scanline effect */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(
                    to bottom,
                    rgba(0, 0, 0, 0) 50%,
                    rgba(255, 255, 255, 0.03) 50%
                );
            background-size: 100% 5px;
            z-index: 9999;
            pointer-events: none !important;
        }

        /* CRT curve effect */
        .crt::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(
                    circle at center,
                    transparent 0%,
                    rgba(0, 0, 0, 0.2) 100%
                );
            pointer-events: none;
            z-index: 1001;
        }
    </style>
</head>
<body class="crt">
    <div class="scanlines" style="pointer-events: none;"></div>
    
    <div id="startScreen" class="screen">
        <div class="pixel-corner tl"></div>
        <div class="pixel-corner tr"></div>
        <div class="pixel-corner bl"></div>
        <div class="pixel-corner br"></div>
        
        <div class="container">
            <h1>PYTHON LEVEL I</h1>
            <p class="description" style="text-align: center; margin: 2rem 0; line-height: 1.6; color: var(--secondary);">
                TEST YOUR KNOWLEDGE IN THIS<br>
                <span style="color: var(--accent); font-size: 1.5rem;">PYHTON LEVEL I</span><br>
                PRESS START TO BEGIN!
            </p>
            <div style="text-align: center;">
                <button id="startBtn" class="btn primary-btn">START GAME</button>
            </div>
        </div>
    </div>

    <div id="gameArea" class="screen" style="display: none;">
        <div class="pixel-corner tl"></div>
        <div class="pixel-corner tr"></div>
        <div class="pixel-corner bl"></div>
        <div class="pixel-corner br"></div>
        
        <div class="game-container" style="position: relative; z-index: 5;">
            <div class="timer-section">
                <div class="timer">TIME: <span id="timer">15</span>s</div>
            </div>
            
            <div class="question-container">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                    <div id="questionNumber" style="color: var(--accent); font-family: 'Press Start 2P', cursive; font-size: 0.8rem;">
                        Question 1 of 10
                    </div>
                </div>
                <h3 id="question" class="question-text">LOADING QUESTION...</h3>
                <div id="optionsContainer" class="options-grid"></div>
            </div>

            <div style="text-align: center; margin-top: 2rem; position: relative; z-index: 10;">
                <button id="nextBtn" class="btn secondary-btn">Next Question →</button>
            </div>
        </div>
    </div>

    <div id="gameOver" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="pixel-corner tl"></div>
            <div class="pixel-corner tr"></div>
            <div class="pixel-corner bl"></div>
            <div class="pixel-corner br"></div>
            
            <div class="modal-header">
                <h2 class="modal-title" style="color: var(--accent); margin-bottom: 1.5rem;">GAME OVER</h2>
                <p id="finalScore" style="color: var(--secondary); margin-bottom: 2rem; font-size: 1.2rem;">
                    YOUR SCORE: <span style="color: var(--accent);">0</span>
                </p>
            </div>
            <button id="restartBtn" class="btn primary-btn">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        // Game state
        let score = 0;
        let timeLeft = 30; // Total time for the entire level
        let timer;
        let currentQuestionIndex = 0;
        let questions = [];
        let gameActive = false; // Track if game is in progress
        let skippedQuestions = []; // Track skipped questions
        let answeredQuestions = new Set(); // Track answered question indices
        
        // Sample questions (replace with your actual questions)
        const sampleQuestions = [
            {
                question: "What is the capital of France?",
                options: ["London", "Paris", "Berlin", "Madrid"],
                correct: 1
            },
            {
                question: "Which language runs in a web browser?",
                options: ["Java", "C", "Python", "JavaScript"],
                correct: 3
            },
            {
                question: "What does HTML stand for?",
                options: [
                    "Hyper Text Markup Language",
                    "Hyperlinks and Text Markup Language",
                    "Home Tool Markup Language",
                    "Hyper Text Makeup Language"
                ],
                correct: 0
            },
            {
                question: "Which operator checks not equal?",
                options: [
                    "==",
                    "!=",
                    "<=",
                    ">="
                ],
                correct: 1
            }
        ];

        // DOM Elements
        const startScreen = document.getElementById('startScreen');
        const gameArea = document.getElementById('gameArea');
        const gameOverScreen = document.getElementById('gameOver');
        const startBtn = document.getElementById('startBtn');
        const skipBtn = document.getElementById('skipBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const restartBtn = document.getElementById('restartBtn');
        const questionElement = document.getElementById('question');
        const questionNumberElement = document.getElementById('questionNumber');
        const optionsContainer = document.getElementById('optionsContainer');
        const timerElement = document.getElementById('timer');
        const finalScoreElement = document.getElementById('finalScore');

        // Initialize the game
        function initGame() {
            // In a real app, you might fetch these from an API
            questions = [...sampleQuestions];
            questions = shuffleArray(questions).slice(0, 10); // Get 10 random questions
            currentQuestionIndex = 0;
            score = 0;
            skippedQuestions = [];
            answeredQuestions = new Set();
            
            // Reset navigation buttons
            updateNavigationButtons();
        }

        // Start the game
        function startGame() {
            initGame();
            gameActive = true;
            startScreen.style.display = 'none';
            gameArea.style.display = 'block';
            startTimer(); // Start the global timer
            loadQuestion();
        }

        // Load a question
        function loadQuestion() {
            if (!gameActive) return; // Don't load new questions if game is over
            
            // Check if all questions are answered or time is up
            if ((answeredQuestions.size === questions.length || timeLeft <= 0) && skippedQuestions.length === 0) {
                endGame();
                return;
            }
            
            // If we've gone through all questions but some were skipped
            if (currentQuestionIndex >= questions.length) {
                // Go to first skipped question
                if (skippedQuestions.length > 0) {
                    currentQuestionIndex = skippedQuestions[0];
                    skippedQuestions.shift(); // Remove from skipped questions
                } else {
                    currentQuestionIndex = 0; // Start from beginning if no skipped questions
                }
            }

            updateNavigationButtons();

            const question = questions[currentQuestionIndex];
            questionElement.textContent = question.question;
            
            // Clear previous options
            optionsContainer.innerHTML = '';
            
            // Add new options
            question.options.forEach((option, index) => {
                const button = document.createElement('button');
                button.className = 'option-btn';
                button.textContent = option;
                button.style.pointerEvents = 'auto';
                
                // Disable if already answered
                if (answeredQuestions.has(currentQuestionIndex)) {
                    button.disabled = true;
                    if (index === question.correct) {
                        button.classList.add('correct');
                    } else if (optionsContainer.children[index]) {
                        button.classList.add('incorrect');
                    }
                }
                
                // Use mousedown instead of click for better mobile support
                button.addEventListener('mousedown', (e) => {
                    e.stopPropagation();
                    selectAnswer(index);
                });
                
                // Also add touch support
                button.addEventListener('touchstart', (e) => {
                    e.stopPropagation();
                    selectAnswer(index);
                }, { passive: true });
                
                optionsContainer.appendChild(button);
            });
        }

        // Handle answer selection
        function selectAnswer(selectedIndex) {
            const question = questions[currentQuestionIndex];
            const options = optionsContainer.children;
            
            // Check if already selected the correct answer
            if (options[question.correct].classList.contains('correct')) {
                return; // Do nothing if correct answer was already selected
            }
            
            // Disable the selected button
            const selectedOption = options[selectedIndex];
            selectedOption.disabled = true;
            
            // Check answer
            if (selectedIndex === question.correct) {
                // Correct answer
                selectedOption.classList.add('correct');
                score += Math.max(5, Math.floor(timeLeft)); // More points for faster answers
                playSound('correct');
                
                // Mark as answered
                answeredQuestions.add(currentQuestionIndex);
                
                // Remove from skipped questions if it was there
                const skipIndex = skippedQuestions.indexOf(currentQuestionIndex);
                if (skipIndex !== -1) {
                    skippedQuestions.splice(skipIndex, 1);
                }
                
                // Move to next question after a delay
                setTimeout(() => {
                    // Find next unanswered question
                    let nextIndex = (currentQuestionIndex + 1) % questions.length;
                    const startIndex = nextIndex;
                    
                    // Find next question that hasn't been answered
                    while (answeredQuestions.has(nextIndex) && nextIndex !== currentQuestionIndex) {
                        nextIndex = (nextIndex + 1) % questions.length;
                        
                        // If we've come full circle, check if there are skipped questions
                        if (nextIndex === startIndex) {
                            if (skippedQuestions.length > 0) {
                                nextIndex = skippedQuestions[0];
                                skippedQuestions.shift();
                            }
                            break;
                        }
                    }
                    
                    currentQuestionIndex = nextIndex;
                    
                    if (timeLeft > 0) {
                        loadQuestion();
                        // Restart the timer for the next question
                        clearInterval(timer);
                        startTimer();
                    } else {
                        endGame();
                    }
                }, 1000);
            } else {
                // Wrong answer
                selectedOption.classList.add('incorrect');
                playSound('incorrect');
                
                // Deduct time for wrong answer (minimum 1 second remaining)
                if (timeLeft > 2) {
                    timeLeft -= 2; // Deduct 2 seconds for wrong answer
                    updateTimer();
                    
                    // Visual feedback for time deduction
                    const timerEl = document.getElementById('timer');
                    timerEl.style.transform = 'scale(1.2)';
                    timerEl.style.color = '#ff4444';
                    setTimeout(() => {
                        timerEl.style.transform = '';
                        if (timeLeft > 5) {
                            timerEl.style.color = '';
                        }
                    }, 300);
                } else {
                    timeLeft = 1; // Ensure at least 1 second remains
                    updateTimer();
                }
                
                // If only one option remains, it must be the correct one
                const remainingOptions = Array.from(options).filter(opt => !opt.disabled);
                if (remainingOptions.length === 1) {
                    // Auto-select the last remaining (correct) option
                    setTimeout(() => {
                        // Ensure timer is running before auto-selecting
                        clearInterval(timer);
                        startTimer();
                        selectAnswer(question.correct);
                    }, 500);
                }
            }
        }

        // Handle moving to next question (with skip functionality)
        function goToNextQuestion() {
            if (!gameActive) return;
            
            // If current question isn't answered, treat as skip
            if (!answeredQuestions.has(currentQuestionIndex)) {
                // Mark as skipped if not already
                if (!skippedQuestions.includes(currentQuestionIndex)) {
                    skippedQuestions.push(currentQuestionIndex);
                }
                
                // Deduct 1 second for skipping
                if (timeLeft > 1) {
                    timeLeft--;
                    updateTimer();
                    
                    // Visual feedback
                    const timerEl = document.getElementById('timer');
                    timerEl.style.transform = 'scale(1.2)';
                    timerEl.style.color = '#ff4444';
                    setTimeout(() => {
                        timerEl.style.transform = '';
                        if (timeLeft > 5) {
                            timerEl.style.color = '';
                        }
                    }, 300);
                }
            }
            
            // Find next unanswered question
            let nextIndex = (currentQuestionIndex + 1) % questions.length;
            const startIndex = nextIndex;
            
            // Find next question that hasn't been answered
            while (answeredQuestions.has(nextIndex) && nextIndex !== currentQuestionIndex) {
                nextIndex = (nextIndex + 1) % questions.length;
                
                // If we've come full circle, check if there are skipped questions
                if (nextIndex === startIndex) {
                    if (skippedQuestions.length > 0) {
                        nextIndex = skippedQuestions[0];
                        skippedQuestions.shift();
                    }
                    break;
                }
            }
            
            currentQuestionIndex = nextIndex;
            loadQuestion();
        }

        // Update navigation buttons state
        function updateNavigationButtons() {
            if (!gameActive) return;
            
            // Update question number display
            questionNumberElement.textContent = `Question ${currentQuestionIndex + 1} of ${questions.length}`;
            
            // Update next button text
            const isAnswered = answeredQuestions.has(currentQuestionIndex);
            nextBtn.textContent = isAnswered ? 'Next Question →' : 'Skip Question (-1s) →';
            
            // If all questions are answered, show finish button
            if (answeredQuestions.size === questions.length) {
                nextBtn.textContent = 'Finish Game';
            }
        }
        
        // Navigate to a specific question
        function navigateToQuestion(index) {
            if (index >= 0 && index < questions.length) {
                currentQuestionIndex = index;
                loadQuestion();
            }
        }

        // Timer functions
        function startTimer() {
            clearInterval(timer);
            updateTimer(); // Initial update
            
            timer = setInterval(() => {
                if (!gameActive) {
                    clearInterval(timer);
                    return;
                }
                
                timeLeft--;
                updateTimer();
                
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    timeUp();
                }
            }, 1000);
        }

        function resetTimer() {
            // No longer needed as we're using a single timer
        }

        function updateTimer() {
            timerElement.textContent = timeLeft;
            
            // Add visual feedback when time is running out
            if (timeLeft <= 5) {
                timerElement.classList.add('low-time');
                timerElement.style.color = '#ff4444';
                timerElement.style.textShadow = '0 0 10px #ff0000';
            } else {
                timerElement.classList.remove('low-time');
                timerElement.style.color = 'var(--accent)';
                timerElement.style.textShadow = '0 0 5px rgba(255, 255, 0, 0.7)';
            }
        }

        function timeUp() {
            if (!gameActive) return;
            
            // Time's up for the entire level
            endGame();
        }

        // End game
        function endGame() {
            gameActive = false;
            clearInterval(timer);
            gameArea.style.display = 'none';
            gameOverScreen.style.display = 'flex';
            
            // Calculate if passed (80% or higher)
            const totalQuestions = questions.length;
            const percentage = Math.round((score / totalQuestions) * 100);
            const passed = percentage >= 80;
            
            // Clear previous content
            finalScoreElement.innerHTML = '';
            
            // Create result container
            const resultContainer = document.createElement('div');
            resultContainer.style.textAlign = 'center';
            
            // Add result message
            const message = document.createElement('h2');
            message.style.color = passed ? 'var(--accent)' : '#ff4444';
            message.style.margin = '2rem 0';
            message.textContent = passed 
                ? 'CONGRATULATIONS, YOU PASSED THE LEVEL!' 
                : 'YOU FAILED, TRY AGAIN';
            resultContainer.appendChild(message);
            
            // Add Home button
            const homeBtn = document.createElement('button');
            homeBtn.className = 'btn primary-btn';
            homeBtn.textContent = 'HOME';
            homeBtn.style.margin = '0 auto';
            homeBtn.style.display = 'block';
            homeBtn.onclick = () => {
                window.location.href = 'indexhome.php';
            };
            
            resultContainer.appendChild(homeBtn);
            finalScoreElement.appendChild(resultContainer);
        }

        // Restart game
        function restartGame() {
            gameOverScreen.style.display = 'none';
            timeLeft = 30; // Reset timer
            score = 0;
            currentQuestionIndex = 0;
            skippedQuestions = [];
            answeredQuestions = new Set();
            startGame();
        }

        // Utility functions
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function playSound(type) {
            // In a real app, you would play sound effects here
            console.log(`Playing ${type} sound`);
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            // Debug: Log button status
            console.log('DOM loaded, startBtn exists:', !!startBtn);
            
            // Initialize event listeners after DOM is loaded with better error handling
            if (startBtn) {
                startBtn.addEventListener('click', (e) => {
                    console.log('Start button clicked');
                    startGame();
                    e.stopPropagation();
                });
                startBtn.style.pointerEvents = 'auto';
            } else {
                console.error('Start button not found!');
            }
            
            if (skipBtn) {
                skipBtn.addEventListener('click', (e) => {
                    console.log('Skip button clicked');
                    skipQuestion();
                    e.stopPropagation();
                });
                skipBtn.style.pointerEvents = 'auto';
                skipBtn.style.position = 'relative';
                skipBtn.style.zIndex = '100';
            } else {
                console.error('Skip button not found!');
            }
            
            if (restartBtn) {
                restartBtn.addEventListener('click', (e) => {
                    console.log('Restart button clicked');
                    restartGame();
                    e.stopPropagation();
                });
            }
            
            // Make sure the button is visible and clickable
            if (startBtn) {
                startBtn.style.pointerEvents = 'auto';
                startBtn.disabled = false;
            }
            
            // Add some retro sound effects (placeholder)
            const sounds = {
                correct: new Audio('data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU...'),
                incorrect: new Audio('data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU...')
            };

            window.playSound = (type) => {
                if (sounds[type]) {
                    sounds[type].currentTime = 0;
                    sounds[type].play().catch(e => console.log('Audio play failed:', e));
                }
            };
            
            // Next button event listener
            nextBtn.addEventListener('click', () => {
                if (answeredQuestions.size === questions.length) {
                    endGame();
                } else {
                    goToNextQuestion();
                }
            });
            
            // Initialize the game
            initGame();
        });
