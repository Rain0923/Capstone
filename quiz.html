<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RETRO QUIZ ARCADE</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff00ff;
            --secondary: #00ffff;
            --accent: #ffff00;
            --bg: #000000;
            --screen: #1a1a2e;
            --pixel: 2px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Press Start 2P', cursive;
            image-rendering: pixelated;
        }

        body {
            background: var(--bg);
            color: var(--primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
            overflow: hidden;
            background: 
                radial-gradient(circle at center, #1a1a2e 0%, #000 100%),
                repeating-linear-gradient(
                    0deg,
                    rgba(255, 0, 255, 0.1) 0px,
                    rgba(255, 0, 255, 0.1) 1px,
                    transparent 1px,
                    transparent 2px
                );
        }

        .screen {
            position: relative;
            width: 90%;
            max-width: 800px;
            background: var(--screen);
            border: 4px solid var(--primary);
            padding: 2rem;
            transform-style: preserve-3d;
            transform: rotateX(5deg) rotateY(-5deg);
            box-shadow: 
                20px 20px 0 rgba(255, 0, 255, 0.2),
                40px 40px 0 rgba(0, 255, 255, 0.1);
        }

        .screen::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                linear-gradient(
                    to bottom,
                    rgba(255, 0, 255, 0.1) 0%,
                    transparent 50%,
                    rgba(0, 255, 255, 0.1) 100%
                );
            pointer-events: none;
        }

        h1 {
            text-align: center;
            margin-bottom: 2rem;
            color: var(--accent);
            text-shadow: 
                3px 3px 0 var(--primary),
                6px 6px 0 var(--secondary);
            font-size: 2.5rem;
            letter-spacing: 2px;
            transform: rotate(-1deg);
            animation: glitch 5s infinite;
        }

        .btn {
            background: var(--primary);
            color: #000;
            border: none;
            padding: 1rem 2rem;
            font-family: 'Press Start 2P', cursive;
            font-size: 1rem;
            cursor: pointer;
            position: relative;
            margin: 1rem 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s;
            border: 4px solid var(--primary);
            box-shadow: 
                4px 4px 0 var(--secondary),
                8px 8px 0 var(--accent);
            z-index: 10; /* Ensure button is above other elements */
            pointer-events: auto !important; /* Force clickable */
        }
        
        /* Make sure the button container is properly positioned */
        .container {
            position: relative;
            z-index: 5;
        }

        .btn:hover {
            transform: translate(2px, 2px);
            box-shadow: 
                2px 2px 0 var(--secondary),
                4px 4px 0 var(--accent);
        }

        .btn:active {
            transform: translate(4px, 4px);
            box-shadow: none;
        }

        .primary-btn {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }

        .secondary-btn {
            background: transparent;
            color: var(--secondary);
            border-color: var(--secondary);
            z-index: 10;
            position: relative;
        }

        .timer-section {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: #000;
            padding: 0.5rem 1rem;
            border: 2px solid var(--accent);
            transform: rotate(2deg);
        }

        .timer {
            color: var(--accent);
            font-size: 1.5rem;
        }

        .question-container {
            margin: 2rem 0;
            padding: 1.5rem;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid var(--secondary);
            position: relative;
        }

        .question-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
        }

        .question-text {
            margin-bottom: 1.5rem;
            line-height: 1.6;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }

        .option-btn {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid var(--primary);
            color: #fff;
            padding: 1rem;
            text-align: left;
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .option-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.1),
                transparent
            );
            transform: translateX(-100%);
            transition: 0.5s;
        }

        .option-btn:hover::before {
            transform: translateX(100%);
        }

        .option-btn.correct {
            background: rgba(0, 255, 0, 0.2);
            border-color: #0f0;
            color: #0f0;
        }

        .option-btn.incorrect {
            background: rgba(255, 0, 0, 0.2);
            border-color: #f00;
            color: #f00;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--screen);
            padding: 2rem;
            border: 4px solid var(--accent);
            max-width: 80%;
            text-align: center;
            position: relative;
            transform-style: preserve-3d;
            animation: modalAppear 0.5s ease-out;
        }

        @keyframes modalAppear {
            from {
                opacity: 0;
                transform: translateY(-50px) rotateX(30deg);
            }
            to {
                opacity: 1;
                transform: translateY(0) rotateX(0);
            }
        }

        @keyframes glitch {
            0%, 100% {
                text-shadow: 
                    3px 3px 0 var(--primary),
                    6px 6px 0 var(--secondary);
            }
            25% {
                text-shadow: 
                    -3px 3px 0 var(--secondary),
                    -6px 6px 0 var(--accent);
            }
            50% {
                text-shadow: 
                    3px -3px 0 var(--accent),
                    6px -6px 0 var(--primary);
            }
            75% {
                text-shadow: 
                    -3px -3px 0 var(--primary),
                    -6px -6px 0 var(--secondary);
            }
        }

        .pixel-corner {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 4px solid var(--accent);
            z-index: 1;
        }

        .pixel-corner.tl {
            top: -10px;
            left: -10px;
            border-right: none;
            border-bottom: none;
        }

        .pixel-corner.tr {
            top: -10px;
            right: -10px;
            border-left: none;
            border-bottom: none;
        }

        .pixel-corner.bl {
            bottom: -10px;
            left: -10px;
            border-right: none;
            border-top: none;
        }

        .pixel-corner.br {
            bottom: -10px;
            right: -10px;
            border-left: none;
            border-top: none;
        }

        /* Scanline effect */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(
                    to bottom,
                    rgba(0, 0, 0, 0) 50%,
                    rgba(255, 255, 255, 0.05) 50%
                );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 1000;
            opacity: 0.5;
        }

        /* CRT curve effect */
        .crt::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(
                    circle at center,
                    transparent 0%,
                    rgba(0, 0, 0, 0.2) 100%
                );
            pointer-events: none;
            z-index: 1001;
        }
    </style>
</head>
<body class="crt">
    <div class="scanlines" style="pointer-events: none;"></div>
    
    <div id="startScreen" class="screen">
        <div class="pixel-corner tl"></div>
        <div class="pixel-corner tr"></div>
        <div class="pixel-corner bl"></div>
        <div class="pixel-corner br"></div>
        
        <div class="container">
            <h1>RETRO QUIZ ARCADE</h1>
            <p class="description" style="text-align: center; margin: 2rem 0; line-height: 1.6; color: var(--secondary);">
                TEST YOUR KNOWLEDGE IN THIS<br>
                <span style="color: var(--accent); font-size: 1.5rem;">RETRO-STYLED QUIZ GAME</span><br>
                PRESS START TO BEGIN!
            </p>
            <div style="text-align: center;">
                <button id="startBtn" class="btn primary-btn">START GAME</button>
            </div>
        </div>
    </div>

    <div id="gameArea" class="screen" style="display: none;">
        <div class="pixel-corner tl"></div>
        <div class="pixel-corner tr"></div>
        <div class="pixel-corner bl"></div>
        <div class="pixel-corner br"></div>
        
        <div class="game-container">
            <div class="timer-section">
                <div class="timer">TIME: <span id="timer">15</span>s</div>
            </div>
            
            <div class="question-container">
                <h3 id="question" class="question-text">LOADING QUESTION...</h3>
                <div id="optionsContainer" class="options-grid"></div>
            </div>

            <div style="text-align: center; margin-top: 2rem; position: relative; z-index: 10;">
                <button id="skipBtn" class="btn secondary-btn" style="pointer-events: auto !important;">SKIP (-1s)</button>
            </div>
        </div>
    </div>

    <div id="gameOver" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="pixel-corner tl"></div>
            <div class="pixel-corner tr"></div>
            <div class="pixel-corner bl"></div>
            <div class="pixel-corner br"></div>
            
            <div class="modal-header">
                <h2 class="modal-title" style="color: var(--accent); margin-bottom: 1.5rem;">GAME OVER</h2>
                <p id="finalScore" style="color: var(--secondary); margin-bottom: 2rem; font-size: 1.2rem;">
                    YOUR SCORE: <span style="color: var(--accent);">0</span>
                </p>
            </div>
            <button id="restartBtn" class="btn primary-btn">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        // Game state
        let score = 0;
        let timeLeft = 15;
        let timer;
        let currentQuestionIndex = 0;
        let questions = [];
        
        // Sample questions (replace with your actual questions)
        const sampleQuestions = [
            {
                question: "What is the capital of France?",
                options: ["London", "Paris", "Berlin", "Madrid"],
                correct: 1
            },
            {
                question: "Which language runs in a web browser?",
                options: ["Java", "C", "Python", "JavaScript"],
                correct: 3
            },
            {
                question: "What does HTML stand for?",
                options: [
                    "Hyper Text Markup Language",
                    "Hyperlinks and Text Markup Language",
                    "Home Tool Markup Language",
                    "Hyper Text Makeup Language"
                ],
                correct: 0
            }
        ];

        // DOM Elements
        const startScreen = document.getElementById('startScreen');
        const gameArea = document.getElementById('gameArea');
        const gameOverScreen = document.getElementById('gameOver');
        const startBtn = document.getElementById('startBtn');
        const skipBtn = document.getElementById('skipBtn');
        const restartBtn = document.getElementById('restartBtn');
        const questionElement = document.getElementById('question');
        const optionsContainer = document.getElementById('optionsContainer');
        const timerElement = document.getElementById('timer');
        const finalScoreElement = document.getElementById('finalScore');

        // Initialize the game
        function initGame() {
            // In a real app, you might fetch these from an API
            questions = [...sampleQuestions];
            questions = shuffleArray(questions).slice(0, 10); // Get 10 random questions
            currentQuestionIndex = 0;
            score = 0;
        }

        // Start the game
        function startGame() {
            initGame();
            startScreen.style.display = 'none';
            gameArea.style.display = 'block';
            loadQuestion();
        }

        // Load a question
        function loadQuestion() {
            if (currentQuestionIndex >= questions.length) {
                endGame();
                return;
            }

            const question = questions[currentQuestionIndex];
            questionElement.textContent = question.question;
            
            // Clear previous options
            optionsContainer.innerHTML = '';
            
            // Add new options
            question.options.forEach((option, index) => {
                const button = document.createElement('button');
                button.className = 'option-btn';
                button.textContent = option;
                button.addEventListener('click', () => selectAnswer(index));
                optionsContainer.appendChild(button);
            });

            // Start timer
            resetTimer();
            startTimer();
        }

        // Handle answer selection
        function selectAnswer(selectedIndex) {
            const question = questions[currentQuestionIndex];
            const options = optionsContainer.children;
            
            // Disable all buttons
            for (let option of options) {
                option.disabled = true;
                option.classList.remove('correct', 'incorrect');
            }

            // Check answer
            if (selectedIndex === question.correct) {
                options[selectedIndex].classList.add('correct');
                score += Math.max(5, Math.floor(timeLeft)); // More points for faster answers
                playSound('correct');
            } else {
                options[selectedIndex].classList.add('incorrect');
                options[question.correct].classList.add('correct');
                playSound('incorrect');
            }

            // Move to next question after a delay
            clearInterval(timer);
            setTimeout(() => {
                currentQuestionIndex++;
                loadQuestion();
            }, 1500);
        }

        // Skip question
        function skipQuestion() {
            if (timeLeft > 2) {
                timeLeft -= 2; // Penalty for skipping
                updateTimer();
            }
            currentQuestionIndex++;
            loadQuestion();
        }

        // Timer functions
        function startTimer() {
            clearInterval(timer);
            timer = setInterval(() => {
                timeLeft--;
                updateTimer();
                
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    timeUp();
                }
            }, 1000);
        }

        function resetTimer() {
            timeLeft = 15;
            updateTimer();
        }

        function updateTimer() {
            timerElement.textContent = timeLeft;
            
            // Add visual feedback when time is running out
            if (timeLeft <= 5) {
                timerElement.style.color = '#ff0000';
                timerElement.style.animation = 'pulse 0.5s infinite';
            } else {
                timerElement.style.color = '';
                timerElement.style.animation = '';
            }
        }

        function timeUp() {
            const options = optionsContainer.children;
            const question = questions[currentQuestionIndex];
            
            // Disable all buttons
            for (let option of options) {
                option.disabled = true;
                option.classList.remove('correct', 'incorrect');
            }
            
            // Show correct answer
            options[question.correct].classList.add('correct');
            
            // Move to next question after a delay
            setTimeout(() => {
                currentQuestionIndex++;
                loadQuestion();
            }, 1500);
        }

        // End game
        function endGame() {
            clearInterval(timer);
            gameArea.style.display = 'none';
            gameOverScreen.style.display = 'flex';
            finalScoreElement.textContent = `YOUR SCORE: ${score}`;
        }

        // Restart game
        function restartGame() {
            gameOverScreen.style.display = 'none';
            startGame();
        }

        // Utility functions
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function playSound(type) {
            // In a real app, you would play sound effects here
            console.log(`Playing ${type} sound`);
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            // Debug: Log button status
            console.log('DOM loaded, buttons exist:', {
                startBtn: !!startBtn,
                skipBtn: !!skipBtn,
                restartBtn: !!restartBtn
            });
            
            // Initialize event listeners after DOM is loaded
            if (startBtn) {
                startBtn.addEventListener('click', (e) => {
                    console.log('Start button clicked');
                    startGame();
                });
                startBtn.style.pointerEvents = 'auto';
                startBtn.disabled = false;
            }
            
            if (skipBtn) {
                skipBtn.addEventListener('click', (e) => {
                    console.log('Skip button clicked');
                    skipQuestion();
                });
                skipBtn.style.pointerEvents = 'auto';
                skipBtn.disabled = false;
            }
            
            if (restartBtn) {
                restartBtn.addEventListener('click', (e) => {
                    console.log('Restart button clicked');
                    restartGame();
                });
                restartBtn.style.pointerEvents = 'auto';
                restartBtn.disabled = false;
            }
            
            // Make sure the button is visible and clickable
            if (startBtn) {
                startBtn.style.pointerEvents = 'auto';
                startBtn.disabled = false;
            }
            
            // Add some retro sound effects (placeholder)
            const sounds = {
                correct: new Audio('data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU...'),
                incorrect: new Audio('data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU...')
            };

            window.playSound = (type) => {
                if (sounds[type]) {
                    sounds[type].currentTime = 0;
                    sounds[type].play().catch(e => console.log('Audio play failed:', e));
                }
            };
            
            // Initialize the game
            initGame();
        });
    </script>
</body>
</html>
